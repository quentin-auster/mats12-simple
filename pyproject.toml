[project]
name = "mats12-simple"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "datasets==3.6.0",
    "librosa==0.11.0",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "transformers==5.16.1",
    "torch==2.11.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mats12_simple"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
